<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>body{margin:0;background:#f5f6f8;font-family:Inter,system-ui,sans-serif;color:#111827}.wrap{max-width:1150px;margin:auto;padding:28px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 4px 18px rgba(15,23,42,.05)}h1,h2{margin-top:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:16px;background:#fafafa;border-radius:12px}.stat b{display:block;font-size:25px;margin-top:4px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;border-top:1px solid #eee;padding:14px 0}.muted{color:#64748b;font-size:12px}.btn{border:1px solid #d1d5db;background:#fff;border-radius:9px;padding:9px 12px;cursor:pointer}.ok{background:#166534;color:#fff;border-color:#166534}.no{background:#b91c1c;color:#fff;border-color:#b91c1c}input{padding:9px;border:1px solid #d1d5db;border-radius:8px;width:90px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.row{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div id="login" class="card"><h2>Admin Login</h2><form id="loginForm"><input id="email" style="width:100%;box-sizing:border-box;margin-bottom:8px" type="email" placeholder="Admin email" required><input id="password" style="width:100%;box-sizing:border-box;margin-bottom:8px" type="password" placeholder="Password" required><button class="btn ok" type="submit">Login</button></form><p id="error" class="muted"></p></div><div id="dash" style="display:none"><div class="card"><h1>Admin Dashboard</h1><button id="logout" class="btn">Logout</button></div><div class="grid"><div class="stat">Users<b id="users">0</b></div><div class="stat">Active<b id="active">0</b></div><div class="stat">Blocked<b id="blocked">0</b></div><div class="stat">Projects<b id="projects">0</b></div></div><div class="card"><h2>Project Limit Upgrade Requests</h2><div id="requests">Loading...</div></div></div></div><script>const cfg=window.BUILDPILOT_CONFIG||{};const sb=supabase.createClient(cfg.SUPABASE_URL||'',cfg.SUPABASE_PUBLISHABLE_KEY||'');const $=id=>document.getElementById(id);function msg(t){$('error').textContent=t}async function adminProfile(user){const {data,error}=await sb.from('profiles').select('id,full_name,role,status').eq('id',user.id).maybeSingle();if(error)throw error;if(!data||data.role!=='admin'||data.status!=='active')throw new Error('Admin access required.');return data}async function dashboard(user){await adminProfile(user);$('login').style.display='none';$('dash').style.display='block';const [u,p]=await Promise.all([sb.from('profiles').select('id,status'),sb.from('projects').select('id')]);$('users').textContent=u.data?.length||0;$('active').textContent=(u.data||[]).filter(x=>x.status==='active').length;$('blocked').textContent=(u.data||[]).filter(x=>x.status==='blocked').length;$('projects').textContent=p.data?.length||0;await requests()}async function requests(){const box=$('requests');const {data,error}=await sb.from('upgrade_requests').select('id,user_id,full_name,mobile_number,email,message,status,requested_limit,approved_limit,created_at').eq('request_type','project_limit').order('created_at',{ascending:false});if(error){box.innerHTML='<p class="muted">'+error.message+'</p>';return}if(!data?.length){box.innerHTML='<p class="muted">No requests.</p>';return}box.innerHTML=data.map(r=>'<div class="row"><div><b>'+esc(r.full_name||'User')+'</b> · '+esc(r.email||'')+'<div class="muted">Mobile: '+esc(r.mobile_number||'-')+' · Requested: '+esc(r.requested_limit||'-')+' · Status: '+esc(r.status||'pending')+'</div><div style="margin-top:6px">'+esc(r.message||'')+'</div></div><div>'+((r.status==='pending')?'<input id="limit-'+r.id+'" type="number" min="1" value="'+esc(r.requested_limit||5)+'"><button class="btn ok" onclick="approve(''+r.id+'')">Approve</button><button class="btn no" onclick="reject(''+r.id+'')">Reject</button>':'<span class="muted">'+esc(r.status)+'</span>')+'</div></div>').join('')}function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}async function approve(id){const limit=Number($('limit-'+id)?.value||0);if(limit<1)return alert('Enter a valid limit.');const {data:r,error:e}=await sb.from('upgrade_requests').select('user_id').eq('id',id).single();if(e)throw e;const {error:pe}=await sb.from('profiles').update({project_limit:limit}).eq('id',r.user_id);if(pe)throw pe;const {error:re}=await sb.from('upgrade_requests').update({status:'approved',approved_limit:limit,updated_at:new Date().toISOString()}).eq('id',id);if(re)throw re;await requests();alert('Approved.')}async function reject(id){const {error}=await sb.from('upgrade_requests').update({status:'rejected',updated_at:new Date().toISOString()}).eq('id',id);if(error)throw error;await requests()}$('loginForm').onsubmit=async e=>{e.preventDefault();try{const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;await dashboard(data.user)}catch(e){msg(e.message)}};$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};sb.auth.getSession().then(x=>{if(x.data.session?.user)dashboard(x.data.session.user).catch(e=>msg(e.message))});</script></body></html>
